<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>太空守衛</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 8px 10px 24px;
      background: #080d20;
      color: #fff;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      text-align: center;
      touch-action: manipulation;
    }

    h1 { margin: 8px 0; color: #80eaff; }
    .instructions { margin: 6px 0 12px; color: #d5e4ff; }

    .stage {
      position: relative;
      width: min(96vw, 800px);
      aspect-ratio: 8 / 5;
      margin: 0 auto;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 2px solid #355b9b;
      border-radius: 12px;
      background: #080d20;
      touch-action: none;
    }

    .screen {
      position: absolute;
      inset: 2px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 10px;
      background: rgba(3, 8, 24, .93);
    }

    .screen.hidden { display: none; }

    .screen h2 {
      margin: 0;
      color: #80eaff;
      font-size: clamp(26px, 6vw, 46px);
      text-shadow: 0 0 16px #36c8ff;
    }

    .screen p { margin: 0; line-height: 1.5; }

    button, .upload-label {
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      background: #36c8ff;
      color: #081329;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active, .upload-label:active { transform: scale(.96); }
    button:disabled { opacity: .55; cursor: default; }
    input[type="file"] { display: none; }

    .shop-items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 620px);
      max-height: 58%;
      overflow-y: auto;
      padding: 2px;
      overscroll-behavior: contain;
    }

    .shop-item {
      padding: 9px;
      border: 1px solid #4774aa;
      border-radius: 10px;
      background: rgba(15, 31, 62, .97);
      text-align: left;
    }

    .shop-item strong { color: #80eaff; }
    .shop-item p { margin: 5px 0; font-size: 13px; }
    .shop-item button { width: 100%; padding: 8px; font-size: 14px; }

    .toolbar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px auto;
    }

    .toolbar button, .toolbar .upload-label {
      padding: 9px 14px;
      font-size: 14px;
    }

    .note { margin: 8px auto; color: #a9bddf; font-size: 13px; }

    .touch-controls {
      display: none;
      width: min(96vw, 800px);
      margin: 12px auto 0;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 48px);
      gap: 4px;
    }

    .dpad button, .fire-button, .skill-button {
      padding: 0;
      border: 2px solid rgba(255,255,255,.55);
      background: rgba(54, 200, 255, .86);
      color: #06152c;
      box-shadow: 0 0 12px rgba(54, 200, 255, .25);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad button { font-size: 23px; }

    .dpad button:active, .fire-button:active, .skill-button:active {
      background: #a3f3ff;
      transform: scale(.96);
    }

    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .center {
      grid-column: 2;
      grid-row: 2;
      background: rgba(30, 65, 110, .7);
      color: #a9d8ff;
    }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 3; }

    .action-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .fire-button {
      width: 84px;
      height: 58px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
    }

    .skill-button {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(159, 83, 255, .9);
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .touch-controls { display: flex; }
      .instructions { font-size: 14px; }
    }

    @media (max-width: 480px) {
      .shop-items { grid-template-columns: 1fr; }
      .shop-item { padding: 7px; }
      #shopScreen { gap: 7px; }
    }
  </style>
</head>
<body>
  <h1>🚀 太空守衛</h1>
  <p class="instructions">方向鍵 / WASD 移動｜上鍵或 W 前進探索｜空白鍵射擊｜E 發射 2 秒光波</p>

  <div class="stage">
    <canvas id="game" width="800" height="500"></canvas>

    <div id="startScreen" class="screen">
      <h2>🚀 太空守衛</h2>
      <p>每 100 分升級武器，每 500 分增加護盾。<br>每 1000 分挑戰大魔王！</p>
      <button id="startButton">開始</button>
      <button id="openShopButton">🔫 武器商店</button>
      <p>代幣：<span id="menuCoins">0</span></p>
    </div>

    <div id="shopScreen" class="screen hidden">
      <h2>🔫 武器商店</h2>
      <p>代幣：<span id="shopCoins">0</span></p>
      <div id="shopItems" class="shop-items"></div>
      <button id="shopBackButton">返回主介面</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <h2>遊戲結束！</h2>
      <p id="finalScore">最終分數：0</p>
      <button id="retryButton">再玩一次</button>
      <button id="menuButton">回主介面</button>
    </div>
  </div>

  <div class="touch-controls" aria-label="手機遊戲控制器">
    <div class="dpad">
      <button class="up" data-key="arrowup" aria-label="向上">▲</button>
      <button class="left" data-key="arrowleft" aria-label="向左">◀</button>
      <button class="center" aria-hidden="true">✦</button>
      <button class="right" data-key="arrowright" aria-label="向右">▶</button>
      <button class="down" data-key="arrowdown" aria-label="向下">▼</button>
    </div>
    <div class="action-buttons">
      <button id="fireButton" class="fire-button">射擊</button>
      <button id="skillButton" class="skill-button">技能<br>E</button>
    </div>
  </div>

  <div class="toolbar">
    <button id="restartButton">重新開始</button>
    <label class="upload-label" for="bossPhoto">選擇魔王照片</label>
    <input id="bossPhoto" type="file" accept="image/*">
  </div>
  <p class="note">每得 10 分獲得 2 代幣。最弱商店槍需要 20 發擊敗普通怪物；代幣存在本機瀏覽器。拉尼亞凱亞之後的天體名稱為遊戲創作。</p>

    function getCurrentLocationIndex() {

      const lastLocation = SPACE_LOCATIONS[lastIndex];

      if (worldDistance < lastLocation.distance + GENERATED_LOCATION_STEP) {
        let index = 0;
        for (let i = 0; i < SPACE_LOCATIONS.length; i++) {
          if (worldDistance >= SPACE_LOCATIONS[i].distance) index = i;
          else break;

        return index;
      }

      const generatedNumber = Math.floor(
        (worldDistance - lastLocation.distance) / GENERATED_LOCATION_STEP
      );

      return lastIndex + generatedNumber;
    }

    function makeGeneratedLocation(number) {
      if (generatedLocationCache.has(number)) {
        return generatedLocationCache.get(number);
      }

      const seed = (Math.imul(number, 2654435761) + 1013904223) >>> 0;
      const forms = [
        "black-hole", "spiral", "barred-spiral", "black-hole", "elliptical",
        "ring", "irregular", "black-hole", "filament", "shell",
        "double-spiral", "black-hole", "cluster-chain", "stellar-arc", "mesh",
        "crescent", "crown", "black-hole", "hourglass", "vortex", "binary", "nebula", "radial"
      ];

      const prefixes = [
        "幻光", "遠古", "蒼藍", "赤焰", "寂靜", "星塵", "夢境",
        "深空", "晶耀", "無垠", "幽影", "黎明", "暮光", "銀霧",

      ];

      const objects = [
        "超大質量黑洞", "事件視界", "引力奇點", "旋轉黑洞", "暗物質黑洞",
        "雙黑洞系統", "星潮", "引力井", "脈衝星群", "星際暗礁",
        "星際長城", "時間裂隙", "星塵海", "雙星迷宮", "宇宙之眼"
      ];

      const suffixes = [
        "星域", "天區", "星團", "星雲", "宇宙泡",
        "星際走廊", "超星系群", "引力海", "宇宙邊疆", "星河領域"
      ];

      function choose(list, salt) {
        const value = (seed + Math.imul(salt, 2246822519)) >>> 0;
        return list[value % list.length];
      }

      const lastLocation = SPACE_LOCATIONS[SPACE_LOCATIONS.length - 1];
      const hue = (number * 47 + 195) % 360;
      const form = forms[number % forms.length];

      const location = {
        distance: lastLocation.distance + number * GENERATED_LOCATION_STEP,
        name: `${choose(prefixes, 1)}${choose(objects, 2)}${choose(suffixes, 3)}・第 ${number} 區`,
        kind: form === "black-hole" ? "black-hole" : "generated",
        form,
        color: `hsl(${hue}, 55%, 12%)`,
        body: form === "black-hole" ? `hsl(${(hue + 40) % 360}, 95%, 68%)` : `hsl(${hue}, 90%, 72%)`,
        hue,
        number,
        rotation: ((seed % 628) / 100) - 3.14,
        arms: 2 + (seed % 5),
        nodes: 6 + ((seed >>> 4) % 9),
        spread: 0.75 + ((seed >>> 8) % 50) / 100,
        scale: 0.8 + ((seed >>> 13) % 45) / 100
      };

      generatedLocationCache.set(number, location);
      return location;
    }

    function getCurrentLocation() {
      const lastLocation = SPACE_LOCATIONS[SPACE_LOCATIONS.length - 1];

      if (worldDistance < lastLocation.distance + GENERATED_LOCATION_STEP) {
        let location = SPACE_LOCATIONS[0];

        for (const candidate of SPACE_LOCATIONS) {
          if (worldDistance >= candidate.distance) location = candidate;
          else break;
        }

        return location;
      }

      const number = Math.floor(
        (worldDistance - lastLocation.distance) / GENERATED_LOCATION_STEP
      );

      return makeGeneratedLocation(number);
    }

      "龍焰追蹤炮", "引力坍縮槍", "超光速連射炮", "天狼星重炮",
      "反物質切割器", "銀河風暴炮", "黑洞吞噬炮", "超新星終極炮"
    ];

    const shopColors = [
      "#54f7ff", "#ff71ec", "#65ff9a", "#ffbf69", "#8ce7ff",
      "#c7a6ff", "#91e9ff", "#ff785e", "#ffe66d", "#a9a0ff",
      "#72fff0", "#ff83c8", "#ff9b54", "#b8d1ff", "#ffffff",
      "#ff6d91", "#d0ff72", "#8ca7ff", "#ff69e2", "#fff4a8"
    ];

    const projectileShapes = [
      "orb", "diamond", "plasma", "star", "beam",
      "flame", "ring", "lightning"
    ];

    const SHOP_WEAPONS = shopWeaponNames.map((name, index) => {
      const tier = index + 1;
      const progress = index / 19;
      const cost = Math.round(10 + 3990 * progress * progress);
      const projectileCount = Math.min(5, 1 + Math.floor((tier - 1) / 4));
      const offsets = projectileCount === 1
        ? [0]
        : Array.from({ length: projectileCount }, (_, i) =>
            (i - (projectileCount - 1) / 2) * 12
          );

      return {
        id: `shop-${tier}`,
        tier,
        name,
        cost,
        damage: tier,
        color: shopColors[index],
        shape: projectileShapes[index % projectileShapes.length],
        offsets,
        interval: Math.max(4, 10 - Math.floor((tier - 1) / 3)),
        speed: 8 + Math.floor(tier / 5)
      };
    });

    function loadSavedValue(key, fallback) {
      try {
        const saved = localStorage.getItem(key);
        return saved === null ? fallback : JSON.parse(saved);
      } catch {
        return fallback;
      }
    }

    let coins = Math.max(0, Number(loadSavedValue("spaceDefenderCoins", 0)) || 0);
    let ownedWeapons = loadSavedValue("spaceDefenderOwnedWeapons", []);
    if (!Array.isArray(ownedWeapons)) ownedWeapons = [];
    ownedWeapons = ownedWeapons.filter(id => SHOP_WEAPONS.some(weapon => weapon.id === id));

    let equippedWeapon = loadSavedValue("spaceDefenderEquippedWeapon", null);
    if (!ownedWeapons.includes(equippedWeapon)) equippedWeapon = null;

    function saveShopData() {
      try {
        localStorage.setItem("spaceDefenderCoins", JSON.stringify(coins));
        localStorage.setItem("spaceDefenderOwnedWeapons", JSON.stringify(ownedWeapons));
        localStorage.setItem("spaceDefenderEquippedWeapon", JSON.stringify(equippedWeapon));
      } catch {}
      updateCoinDisplays();
    }

    function updateCoinDisplays() {
      document.getElementById("menuCoins").textContent = coins;
      document.getElementById("shopCoins").textContent = coins;
    }

    function renderShop() {
      updateCoinDisplays();
      const container = document.getElementById("shopItems");

      container.innerHTML = SHOP_WEAPONS.map((weapon) => {
        const owned = ownedWeapons.includes(weapon.id);
        const equipped = equippedWeapon === weapon.id;
        const label = equipped
          ? "已裝備"
          : owned
            ? "裝備這把槍"
            : `購買：${weapon.cost} 代幣`;
        const disabled = equipped || (!owned && coins < weapon.cost);

        return `
          <div class="shop-item">
            <strong>Lv.${weapon.tier} ${weapon.name}</strong>
            <p>每發傷害：${weapon.damage}</p>
            <p>價格：${weapon.cost} 代幣</p>
            <button type="button" data-weapon="${weapon.id}" ${disabled ? "disabled" : ""}>
              ${label}
            </button>
          </div>
        `;
      }).join("");

      container.querySelectorAll("button[data-weapon]").forEach((button) => {
        button.addEventListener("click", () => {
          const weapon = SHOP_WEAPONS.find(item => item.id === button.dataset.weapon);
          if (!weapon) return;

          if (!ownedWeapons.includes(weapon.id)) {
            if (coins < weapon.cost) return;
            coins -= weapon.cost;
            ownedWeapons.push(weapon.id);
          }

          equippedWeapon = weapon.id;
          saveShopData();
          renderShop();
        });
      });
    }

    function roundedRectPath(x, y, width, height, radius) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.arcTo(x + width, y, x + width - r, y + r, r);
      ctx.lineTo(x + width, y + height - r);
      ctx.arcTo(x + width, y + height, x + width - r, y + height, r);
      ctx.lineTo(x + r, y + height);
      ctx.arcTo(x, y + height, x + r, y + height - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function resetGame() {
      player = { x: 400, y: 420, size: 26, speed: 5 };
      stars = Array.from({ length: 110 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1
      }));

      enemies = [];
      shots = [];
      boss = null;
      score = 0;
      lives = 3;
      frame = 0;
      worldDistance = 0;
      weaponLevel = 1;
      nextUpgradeScore = 100;
      shieldStars = 0;
      nextShieldScore = 500;
      upgradeTimer = 0;
      shieldTimer = 0;
      hitFlashTimer = 0;
      nextBossScore = 1000;
      pendingBosses = 0;
      skillTimer = 0;
      skillCooldown = 0;
      skillDamageTimer = 0;
    }

    function clearInputs() {
      for (const key of Object.keys(keys)) delete keys[key];
      for (const key of Object.keys(touchKeys)) delete touchKeys[key];
    }

    function startGame() {
      resetGame();
      gameState = "playing";
      startScreen.classList.add("hidden");
      shopScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      clearInputs();
    }

    function showMenu() {
      gameState = "menu";
      startScreen.classList.remove("hidden");
      shopScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      clearInputs();
    }

    function openShop() {
      gameState = "shop";
      startScreen.classList.add("hidden");
      shopScreen.classList.remove("hidden");
      gameOverScreen.classList.add("hidden");
      clearInputs();
      renderShop();
    }

    function closeShop() {
      gameState = "menu";
      shopScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
      clearInputs();
      updateCoinDisplays();
    }

    function endGame() {
      if (gameState !== "playing") return;
      gameState = "over";
      document.getElementById("finalScore").textContent = "最終分數：" + score;
      gameOverScreen.classList.remove("hidden");
      clearInputs();
    }

    document.getElementById("startButton").addEventListener("click", startGame);
    document.getElementById("retryButton").addEventListener("click", startGame);
    document.getElementById("restartButton").addEventListener("click", startGame);
    document.getElementById("menuButton").addEventListener("click", showMenu);
    document.getElementById("openShopButton").addEventListener("click", openShop);
    document.getElementById("shopBackButton").addEventListener("click", closeShop);

    document.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;
      if (event.code === "Space") event.preventDefault();

      if (event.code === "KeyE" && !event.repeat && gameState === "playing") {
        activateSkill();
      }
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    document.querySelectorAll(".dpad button[data-key]").forEach((button) => {
      const key = button.dataset.key;

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (gameState !== "playing") return;
        try { button.setPointerCapture(event.pointerId); } catch (_) {}
        touchKeys[key] = true;
      });

      const release = () => { touchKeys[key] = false; };
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    const fireButton = document.getElementById("fireButton");
    fireButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (gameState !== "playing") return;
      try { fireButton.setPointerCapture(event.pointerId); } catch (_) {}
      touchKeys[" "] = true;
    });

    function stopFiring() { touchKeys[" "] = false; }
    fireButton.addEventListener("pointerup", stopFiring);
    fireButton.addEventListener("pointercancel", stopFiring);
    fireButton.addEventListener("lostpointercapture", stopFiring);

    document.getElementById("skillButton").addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (gameState === "playing") activateSkill();
    });

    window.addEventListener("blur", clearInputs);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearInputs();
    });

    function isDown(key) {
      return Boolean(keys[key] || touchKeys[key]);
    }

    function activateSkill() {
      if (gameState !== "playing" || skillCooldown > 0 || skillTimer > 0) return;
      skillTimer = SKILL_DURATION;
      skillCooldown = SKILL_COOLDOWN;
      skillDamageTimer = 0;
    }

    function addScore(points) {
      const oldScore = score;
      score += points;

      const tokensEarned = Math.floor(score / 10) - Math.floor(oldScore / 10);
      if (tokensEarned > 0) {
        coins += tokensEarned * 2;
        saveShopData();
      }

      while (score >= nextUpgradeScore) {
        if (weaponLevel < MAX_WEAPON_LEVEL) {
          weaponLevel++;
          upgradeTimer = 100;
        }
        nextUpgradeScore += 100;
      }

      while (score >= nextShieldScore) {
        shieldStars++;
        shieldTimer = 90;
        nextShieldScore += 500;
      }

      while (score >= nextBossScore) {
        pendingBosses++;
        nextBossScore += 1000;
      }

      spawnBossIfNeeded();
    }

    function spawnBossIfNeeded() {
      if (boss || pendingBosses <= 0) return;

      pendingBosses--;

      if (!uploadedBossUrl && DEFAULT_BOSS_IMAGES.length > 0) {
        const randomDataUrl = DEFAULT_BOSS_IMAGES[Math.floor(Math.random() * DEFAULT_BOSS_IMAGES.length)];
        bossImage = new Image();
        bossImage.src = randomDataUrl;
      }

      boss = {
        x: canvas.width / 2,
        y: 110,
        width: 140,
        height: 140,
        hp: 3,
        maxHp: 3,
        direction: 1,
        speed: 2,
        hitFlash: 0,
        hitCooldown: 0,
        contactCooldown: 0
      };
      shots = [];
    }

    function drawStar(x, y, outer, inner, points = 5) {
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / points;
        const radius = i % 2 === 0 ? outer : inner;
        const px = x + Math.cos(angle) * radius;
        const py = y + Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function getActiveWeapon() {
      return SHOP_WEAPONS.find(weapon => weapon.id === equippedWeapon)
        || weaponConfigs[Math.min(weaponLevel, MAX_WEAPON_LEVEL)];
    }

    function drawGun() {
      const shopWeapon = SHOP_WEAPONS.find(weapon => weapon.id === equippedWeapon);
      const config = getActiveWeapon();
      const fallbackColors = [
        null, "#794cff", "#315bea", "#167f6a", "#6427ba",
        "#f4a900", "#cf3c28", "#5142c5", "#b8c5d8"
      ];

      const bodyColor = shopWeapon
        ? shopColors[shopWeapon.tier - 1]
        : fallbackColors[weaponLevel];

      ctx.save();
      ctx.lineJoin = "round";
      ctx.fillStyle = bodyColor;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;

      roundedRectPath(18, -17, 18, 15, 4);
      ctx.fill();
      ctx.stroke();

      const barrelCount = Math.min(config.offsets.length, 4);
      for (let i = 0; i < barrelCount; i++) {
        const offset = (i - (barrelCount - 1) / 2) * 7;
        ctx.fillStyle = config.color;
        roundedRectPath(22 + offset, -30, 6, 15, 3);
        ctx.fill();
        ctx.stroke();
      }

      ctx.fillStyle = config.color;
      ctx.shadowColor = config.color;
      ctx.shadowBlur = 12;

      if (shopWeapon && shopWeapon.tier >= 18) {
        drawStar(27, -10, 8 + Math.sin(frame * .15) * 1.5, 3);
      } else if (shopWeapon && shopWeapon.shape === "diamond") {
        ctx.beginPath();
        ctx.moveTo(27, -17);
        ctx.lineTo(33, -10);
        ctx.lineTo(27, -3);
        ctx.lineTo(21, -10);
        ctx.closePath();
      } else if (weaponLevel >= 5) {
        drawStar(27, -10, 6, 3);
      } else {
        ctx.beginPath();
        ctx.arc(27, -10, 4, 0, Math.PI * 2);
      }

      ctx.fill();

      if ((shopWeapon && shopWeapon.tier >= 15) || (!shopWeapon && weaponLevel >= 7)) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = config.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(27, -16, 16, 6, frame * .04, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawPlayer() {
      const s = player.size;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      if (shieldStars > 0) {
        ctx.strokeStyle = "rgba(91,231,255,.8)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#45eaff";
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, s * 1.65 + Math.sin(frame * .12) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      if (hitFlashTimer > 0) {
        ctx.fillStyle = `rgba(255,255,255,${hitFlashTimer / 18})`;
        ctx.beginPath();
        ctx.arc(0, 0, s * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#58e6ff";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s, s * .8);
      ctx.lineTo(-s, s * .8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-s * .7, 0);
      ctx.lineTo(-s * 1.3, -5);
      ctx.moveTo(-s * .4, s * .8);
      ctx.lineTo(-s * .7, s * 1.3);
      ctx.moveTo(s * .4, s * .8);
      ctx.lineTo(s * .7, s * 1.3);
      ctx.stroke();

      ctx.fillStyle = "#081329";
      ctx.fillRect(-6, -6, 3, 8);
      ctx.fillRect(3, -6, 3, 8);

      ctx.strokeStyle = "#081329";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-7, 7);
      ctx.lineTo(0, 14);
      ctx.lineTo(8, 7);
      ctx.stroke();

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(s * .62, 0);
      ctx.lineTo(s * .95, -7);
      ctx.stroke();

      drawGun();
      ctx.restore();
    }

    function drawHealthBar(x, y, width, hp, maxHp) {
      const ratio = Math.max(0, Math.min(1, hp / maxHp));
      const barY = y - 38;

      ctx.save();
      ctx.fillStyle = "rgba(20, 8, 18, .9)";
      ctx.fillRect(x - width / 2, barY, width, 8);
      ctx.fillStyle = ratio > .5 ? "#65ff9a" : ratio > .25 ? "#ffe66d" : "#ff526f";
      ctx.fillRect(x - width / 2 + 1, barY + 1, (width - 2) * ratio, 6);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      ctx.strokeRect(x - width / 2, barY, width, 8);
      ctx.fillStyle = "#fff";
      ctx.font = "10px Arial";
      ctx.textAlign = "center";
      ctx.fillText(`${Math.max(0, hp)}/${maxHp}`, x, barY - 2);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      const r = enemy.r;
      const limbs = [
        [-r * .82, -r * .08, -r * 1.55, -r * .45],
        [r * .82, -r * .08, r * 1.55, -r * .45],
        [-r * .38, r * .82, -r * .78, r * 1.5],
        [r * .38, r * .82, r * .78, r * 1.5]
      ];

      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (const [color, width] of [
        ["#17131a", Math.max(8, r * .24)],
        ["#fff", Math.max(4, r * .12)]
      ]) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        for (const [x1, y1, x2, y2] of limbs) {
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        }
        ctx.stroke();
      }

      ctx.fillStyle = "#f4f7ff";
      ctx.strokeStyle = "#17131a";
      ctx.lineWidth = Math.max(3, r * .09);
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#17131a";
      ctx.lineWidth = Math.max(4, r * .13);
      ctx.beginPath();
      ctx.moveTo(-r * .25, -r * .48);
      ctx.lineTo(-r * .31, -r * .08);
      ctx.moveTo(r * .25, -r * .48);
      ctx.lineTo(r * .22, -r * .08);
      ctx.stroke();

      ctx.lineWidth = Math.max(4, r * .14);
      ctx.beginPath();
      ctx.moveTo(-r * .48, r * .12);
      ctx.lineTo(-r * .12, r * .68);
      ctx.lineTo(r * .58, r * .18);
      ctx.stroke();
      ctx.restore();

      drawHealthBar(enemy.x, enemy.y, 48, enemy.hp, enemy.maxHp);
    }

    function drawBoss() {
      if (!boss) return;

      const left = boss.x - boss.width / 2;
      const top = boss.y - boss.height / 2;

      ctx.save();
      roundedRectPath(left, top, boss.width, boss.height, 22);
      ctx.clip();

      if (bossImage.complete && bossImage.naturalWidth > 0) {
        const scale = Math.max(
          boss.width / bossImage.naturalWidth,
          boss.height / bossImage.naturalHeight
        );
        const sw = boss.width / scale;
        const sh = boss.height / scale;

        ctx.drawImage(
          bossImage,
          (bossImage.naturalWidth - sw) / 2,
          (bossImage.naturalHeight - sh) / 2,
          sw, sh, left, top, boss.width, boss.height
        );
      } else {
        ctx.fillStyle = "#8b224d";
        ctx.fillRect(left, top, boss.width, boss.height);
        ctx.fillStyle = "#ffd8e6";
        ctx.font = "bold 30px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("大魔王", boss.x, boss.y);
      }

      if (boss.hitFlash > 0) {
        ctx.fillStyle = "rgba(255,255,255,.65)";
        ctx.fillRect(left, top, boss.width, boss.height);
      }
      ctx.restore();

      ctx.strokeStyle = "#ff4f91";
      ctx.lineWidth = 5;
      ctx.shadowColor = "#ff4f91";
      ctx.shadowBlur = 16;
      roundedRectPath(left, top, boss.width, boss.height, 22);
      ctx.stroke();
      ctx.shadowBlur = 0;

      const barWidth = 120;
      const barY = top - 22;
      ctx.fillStyle = "#321222";
      ctx.fillRect(boss.x - barWidth / 2, barY, barWidth, 12);
      ctx.fillStyle = "#ff416d";
      ctx.fillRect(boss.x - barWidth / 2, barY, barWidth * boss.hp / boss.maxHp, 12);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(boss.x - barWidth / 2, barY, barWidth, 12);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 16px Arial";
      ctx.fillText(`大魔王 ${boss.hp} / ${boss.maxHp}`, boss.x, barY - 7);
    }

    function updateBoss() {
      if (!boss) return;

      boss.x += boss.direction * boss.speed;
      const edge = boss.width / 2 + 8;

      if (boss.x > canvas.width - edge) {
        boss.x = canvas.width - edge;
        boss.direction = -1;
      } else if (boss.x < edge) {
        boss.x = edge;
        boss.direction = 1;
      }

      if (boss.hitFlash > 0) boss.hitFlash--;
      if (boss.hitCooldown > 0) boss.hitCooldown--;
      if (boss.contactCooldown > 0) boss.contactCooldown--;
    }

    function damageBoss(amount = 1) {
      if (!boss) return;
      boss.hp -= amount;
      boss.hitFlash = 8;

      if (boss.hp <= 0) {
        boss = null;
        addScore(100);
      }
    }

    function fireWeapon() {
      const config = getActiveWeapon();

      for (const offset of config.offsets) {
        shots.push({
          x: player.x + 26 + offset * .45,
          y: player.y - player.size - 24,
          vx: offset * .025,
          speed: config.speed,
          color: config.color,
          shape: config.shape,
          damage: config.damage || weaponLevel,
          hit: false,
          rotation: Math.random() * Math.PI
        });
      }
    }

    function drawShot(shot) {
      ctx.save();
      ctx.translate(shot.x, shot.y);
      ctx.rotate(shot.rotation + frame * .04);
      ctx.fillStyle = shot.color;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.shadowColor = shot.color;
      ctx.shadowBlur = 12;

      if (shot.shape === "orb") {
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (shot.shape === "diamond") {
        ctx.beginPath();
        ctx.moveTo(0, -7); ctx.lineTo(5, 0); ctx.lineTo(0, 7); ctx.lineTo(-5, 0);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (shot.shape === "plasma") {
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#eafff5";
        ctx.beginPath(); ctx.arc(-2, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (shot.shape === "star") {
        drawStar(0, 0, 8, 3.5); ctx.fill(); ctx.stroke();
      } else if (shot.shape === "beam") {
        ctx.fillRect(-4, -13, 8, 26);
        ctx.fillStyle = "#fff";
        ctx.fillRect(-1.5, -10, 3, 20);
      } else if (shot.shape === "flame") {
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.quadraticCurveTo(9, -1, 0, 9);
        ctx.quadraticCurveTo(-9, -1, 0, -10);
        ctx.fill(); ctx.stroke();
      } else if (shot.shape === "ring") {
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(-4, -10); ctx.lineTo(3, -2); ctx.lineTo(-2, 1);
        ctx.lineTo(5, 10); ctx.lineTo(-5, 1); ctx.lineTo(0, -2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }

      ctx.restore();
    }



    function drawSpiralGalaxy(cx, cy, rx, ry, color, arms = 2, rotation = 0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const halo = ctx.createRadialGradient(0, 0, 3, 0, 0, rx);
      halo.addColorStop(0, "rgba(255,255,255,.95)");
      halo.addColorStop(.12, color);
      halo.addColorStop(.55, "rgba(145,135,220,.3)");
      halo.addColorStop(1, "rgba(20,25,60,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.rotate(-.25);
      ctx.fillStyle = "rgba(255,232,185,.88)";
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * .32, ry * .12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (let arm = 0; arm < arms; arm++) {
        const startAngle = arm * Math.PI * 2 / arms;
        ctx.beginPath();

        for (let i = 0; i <= 180; i++) {
          const t = .04 + i / 180 * .96;
          const angle = startAngle + t * Math.PI * 2.7;
          const x = Math.cos(angle) * rx * t;
          const y = Math.sin(angle) * ry * t;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.strokeStyle = color;
        ctx.globalAlpha = .78;
        ctx.lineWidth = Math.max(5, ry * .045);
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff4d0";
      ctx.shadowColor = "#fff1bd";
      ctx.shadowBlur = 22;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * .1, ry * .16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEllipticalGalaxy(cx, cy, rx, ry, color, angle = 0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, rx);
      glow.addColorStop(0, "#fff4d8");
      glow.addColorStop(.22, color);
      glow.addColorStop(1, "rgba(90,110,190,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBlackHole(cx, cy, radius = 55, accentColor = "#ff9e42") {
      ctx.save();
      ctx.translate(cx, cy);

      // 上下相對論噴流 (Relativistic Jets)
      const jetGlow = ctx.createLinearGradient(0, -radius * 2.8, 0, radius * 2.8);
      jetGlow.addColorStop(0, "rgba(100, 220, 255, 0)");
      jetGlow.addColorStop(0.3, "rgba(160, 230, 255, 0.75)");
      jetGlow.addColorStop(0.5, "rgba(255, 255, 255, 0.95)");
      jetGlow.addColorStop(0.7, "rgba(160, 230, 255, 0.75)");
      jetGlow.addColorStop(1, "rgba(100, 220, 255, 0)");
      ctx.fillStyle = jetGlow;
      ctx.fillRect(-6, -radius * 2.8, 12, radius * 5.6);

      // 吸積盤幾何扭曲外環 (Outer Accretion Halo)
      const halo = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 2.5);
      halo.addColorStop(0, "rgba(255, 255, 255, 0.9)");
      halo.addColorStop(0.2, accentColor);
      halo.addColorStop(0.55, "rgba(255, 80, 20, 0.45)");
      halo.addColorStop(1, "rgba(15, 8, 30, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 2.4, radius * 1.35, -0.22, 0, Math.PI * 2);
      ctx.fill();

      // 引力透鏡效應頂部彎曲光弧 (Gravitational Lensing Top Arc)
      ctx.save();
      ctx.rotate(-0.22);
      ctx.strokeStyle = accentColor;
      ctx.lineWidth = radius * 0.38;
      ctx.shadowColor = accentColor;
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.ellipse(0, -radius * 0.3, radius * 1.5, radius * 0.9, 0, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();
      ctx.restore();

      // 事件視界中心黑洞死核 (Event Horizon & Dark Core)
      ctx.fillStyle = "#020308";
      ctx.shadowColor = "#000000";
      ctx.shadowBlur = 35;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.85, 0, Math.PI * 2);
      ctx.fill();

      // 事件視界亮邊界 (Photon Ring)
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3.5;
      ctx.shadowColor = accentColor;
      ctx.shadowBlur = 18;
      ctx.stroke();

      // 前景吸積盤 (Foreground Accretion Disk Segment)
      ctx.save();
      ctx.rotate(-0.22);
      const frontGrad = ctx.createLinearGradient(-radius * 2, 0, radius * 2, 0);
      frontGrad.addColorStop(0, "rgba(255, 120, 30, 0.1)");
      frontGrad.addColorStop(0.3, accentColor);
      frontGrad.addColorStop(0.5, "#ffffff");
      frontGrad.addColorStop(0.7, accentColor);
      frontGrad.addColorStop(1, "rgba(255, 120, 30, 0.1)");
      ctx.strokeStyle = frontGrad;
      ctx.lineWidth = radius * 0.32;
      ctx.shadowColor = accentColor;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 2.1, radius * 0.5, 0, 0, Math.PI);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function drawLaniakea(cx, cy, color = "#ffe38a") {
      const nodes = [
        [-350, -150], [-255, -55], [-190, 110], [-100, -125],
        [-25, 30], [65, -165], [130, 105], [215, -60],
        [330, 145], [360, -145], [0, 190], [-365, 155]
      ];

      const links = [
        [0, 1], [1, 2], [1, 3], [3, 4], [4, 5], [4, 6],
        [5, 7], [6, 7], [7, 8], [7, 9], [2, 10], [10, 8],
        [11, 2], [3, 5], [1, 4], [4, 7], [6, 10]
      ];

      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;

      for (const [a, b] of links) {
        const p1 = nodes[a];
        const p2 = nodes[b];
        const bend = (a + b) % 2 ? 34 : -34;

        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.quadraticCurveTo(
          (p1[0] + p2[0]) / 2 + bend,
          (p1[1] + p2[1]) / 2 - bend,
          p2[0], p2[1]
        );
        ctx.stroke();
      }

      for (const [x, y] of nodes) {
        const glow = ctx.createRadialGradient(x, y, 2, x, y, 34);
        glow.addColorStop(0, "#fff6cf");
        glow.addColorStop(.18, color);
        glow.addColorStop(1, "rgba(255,190,120,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, 34, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawGeneratedCosmos(cx, cy, location) {
      const hue = location.hue;
      const color = location.body;
      const rotation = location.rotation;
      const scale = location.scale;
      const nodes = location.nodes;

      function drawGlow(x, y, radius, tint = color) {
        const glow = ctx.createRadialGradient(x, y, 2, x, y, radius);
        glow.addColorStop(0, "#fff8dc");
        glow.addColorStop(0.22, tint);
        glow.addColorStop(1, "rgba(10, 14, 35, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOrbit(rx, ry, angle, tint = color, lineWidth = 3) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.strokeStyle = tint;
        ctx.lineWidth = lineWidth;
        ctx.shadowColor = tint;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawDots(count, rx, ry, tint = color) {
        for (let i = 0; i < count; i++) {
          const angle = i * Math.PI * 2 / count + rotation;
          const wobble = 0.82 + ((i * 17 + location.number) % 7) * 0.055;
          drawGlow(
            cx + Math.cos(angle) * rx * wobble,
            cy + Math.sin(angle) * ry * wobble,
            12 + (i % 3) * 5,
            tint
          );
        }
      }

      switch (location.form) {
        case "black-hole":
          drawBlackHole(cx, cy, 65 * scale, color);
          break;

        case "spiral":
          drawSpiralGalaxy(cx, cy, 340 * scale, 190 * scale, color, location.arms, rotation);
          break;

        case "barred-spiral":
          drawSpiralGalaxy(cx, cy, 310 * scale, 170 * scale, color, 4, rotation);
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rotation);
          ctx.strokeStyle = "#fff0c2";
          ctx.lineWidth = 9;
          ctx.beginPath();
          ctx.moveTo(-115 * scale, 0);
          ctx.lineTo(115 * scale, 0);
          ctx.stroke();
          ctx.restore();
          break;

        case "elliptical":
          drawEllipticalGalaxy(cx, cy, 300 * scale, 145 * scale, color, rotation);
          drawOrbit(250 * scale, 105 * scale, rotation + 0.35, color, 2);
          break;

        case "ring":
          for (let i = 0; i < 5; i++) {
            drawOrbit(
              (115 + i * 36) * scale,
              (48 + i * 17) * scale,
              rotation + i * 0.08,
              `hsl(${(hue + i * 13) % 360}, 90%, ${65 + i * 3}%)`,
              3 + (i % 2)
            );
          }
          drawGlow(cx, cy, 72 * scale);
          break;

        case "irregular": {
          const positions = [
            [-210, -75], [-130, -155], [-25, -105], [110, -175],
            [215, -60], [165, 95], [35, 165], [-120, 115], [-220, 35]
          ];
          positions.forEach(([x, y], i) => {
            const tint = `hsl(${(hue + i * 29) % 360}, 90%, 72%)`;
            drawGlow(cx + x * scale, cy + y * scale, 38 + (i % 4) * 13, tint);
          });
          break;
        }

        case "filament":
          drawLaniakea(cx, cy, color);
          drawDots(nodes, 280 * scale, 150 * scale);
          break;

        case "shell":
          for (let i = 0; i < 6; i++) {
            drawOrbit(
              (70 + i * 35) * scale,
              (55 + i * 23) * scale,
              rotation + i * 0.19,
              `hsla(${(hue + i * 18) % 360}, 90%, 72%, .8)`,
              2 + (i % 3)
            );
          }
          drawGlow(cx, cy, 52 * scale);
          break;

        case "double-spiral":
          drawSpiralGalaxy(cx - 125 * scale, cy, 205 * scale, 115 * scale, color, 3, rotation);
          drawSpiralGalaxy(
            cx + 135 * scale, cy + 25 * scale, 175 * scale, 100 * scale,
            `hsl(${(hue + 55) % 360}, 90%, 72%)`, 2, -rotation
          );
          break;

        case "cluster-chain":
          for (let i = 0; i < nodes; i++) {
            const t = i / Math.max(1, nodes - 1);
            const x = cx - 300 * scale + t * 600 * scale;
            const y = cy + Math.sin(t * Math.PI * 3 + rotation) * 85 * scale;
            drawEllipticalGalaxy(
              x, y,
              (34 + (i % 3) * 13) * scale,
              (20 + (i % 2) * 10) * scale,
              `hsl(${(hue + i * 24) % 360}, 90%, 74%)`,
              rotation + i * 0.2
            );
          }
          break;

        case "stellar-arc":
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rotation);
          ctx.strokeStyle = color;
          ctx.lineWidth = 5;
          ctx.shadowColor = color;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(0, 0, 190 * scale, Math.PI * 1.08, Math.PI * 1.92);
          ctx.stroke();
          ctx.restore();
          drawDots(nodes, 190 * scale, 110 * scale);
          break;

        case "mesh":
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rotation);
          ctx.strokeStyle = `hsla(${hue}, 90%, 72%, .7)`;
          ctx.lineWidth = 2;
          for (let i = 0; i < nodes; i++) {
            const a = i * Math.PI * 2 / nodes;
            const x = Math.cos(a) * 245 * scale;
            const y = Math.sin(a) * 145 * scale;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(x, y);
            ctx.stroke();
            drawGlow(cx + x, cy + y, 22, color);
          }
          ctx.restore();
          break;

        case "crescent":
          drawGlow(cx, cy, 205 * scale);
          ctx.save();
          ctx.fillStyle = "rgba(5, 10, 28, .9)";
          ctx.beginPath();
          ctx.arc(cx + 70 * scale, cy - 25 * scale, 165 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          drawOrbit(210 * scale, 110 * scale, rotation, color, 4);
          break;

        case "crown":
          drawDots(nodes, 225 * scale, 135 * scale);
          drawOrbit(220 * scale, 135 * scale, rotation, color, 2);
          drawGlow(cx, cy, 42 * scale);
          break;

        case "hourglass":
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rotation);
          ctx.strokeStyle = color;
          ctx.lineWidth = 5;
          ctx.shadowColor = color;
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(-230 * scale, -145 * scale);
          ctx.quadraticCurveTo(0, -25 * scale, 230 * scale, -145 * scale);
          ctx.moveTo(-230 * scale, 145 * scale);
          ctx.quadraticCurveTo(0, 25 * scale, 230 * scale, 145 * scale);
          ctx.stroke();
          ctx.restore();
          drawGlow(cx, cy, 55 * scale);
          drawDots(nodes, 180 * scale, 105 * scale);
          break;

        case "vortex":
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rotation);
          ctx.strokeStyle = color;
          ctx.lineWidth = 4;
          ctx.shadowColor = color;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          for (let i = 0; i <= 240; i++) {
            const t = i / 240;
            const angle = t * Math.PI * 5;
            const radius = 12 + t * 230 * scale;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius * 0.55;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.restore();
          drawGlow(cx, cy, 35 * scale);
          break;

        case "binary":
          drawEllipticalGalaxy(cx - 125 * scale, cy, 155 * scale, 85 * scale, color, rotation);
          drawEllipticalGalaxy(
            cx + 125 * scale, cy, 155 * scale, 85 * scale,
            `hsl(${(hue + 75) % 360}, 90%, 74%)`, -rotation
          );
          drawOrbit(255 * scale, 70 * scale, rotation, color, 2);
          break;

        case "nebula":
          for (let i = 0; i < 7; i++) {
            const angle = rotation + i * Math.PI * 2 / 7;
            const x = cx + Math.cos(angle) * 120 * scale;
            const y = cy + Math.sin(angle) * 75 * scale;
            const tint = `hsla(${(hue + i * 31) % 360}, 90%, 68%, .8)`;
            drawGlow(x, y, (105 + (i % 3) * 25) * scale, tint);
          }
          break;

        case "radial":
          for (let i = 0; i < nodes; i++) {
            const angle = rotation + i * Math.PI * 2 / nodes;
            const inner = 35 * scale;
            const outer = (180 + (i % 4) * 28) * scale;
            ctx.save();
            ctx.strokeStyle = `hsl(${(hue + i * 21) % 360}, 90%, 72%)`;
            ctx.lineWidth = 4 + (i % 3);
            ctx.shadowColor = color;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner);
            ctx.lineTo(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer);
            ctx.stroke();
            ctx.restore();
            drawGlow(cx + Math.cos(angle) * outer, cy + Math.sin(angle) * outer, 20);
          }
          drawGlow(cx, cy, 45 * scale);
          break;
      }
    }

    function drawBackground(animate) {
      const location = getCurrentLocation();
      const movingForward = animate && (isDown("arrowup") || isDown("w"));

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, location.color);
      gradient.addColorStop(1, "#050812");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        if (animate) {
          star.y += star.size * .4 + (movingForward ? 12 : 0);
          if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
          }
        }

        ctx.fillStyle = "#fff";
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }

      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 8;
      const radius = (location.size || 0) / 2;

      if (location.kind === "black-hole" || location.form === "black-hole") {
        drawBlackHole(cx, cy, radius || (65 * (location.scale || 1)), location.body);
      } else if (location.kind === "local-group") {
        drawSpiralGalaxy(cx - 145, cy + 10, 260, 145, "#b9a3ff", 2, -.18);
        drawSpiralGalaxy(cx + 185, cy - 25, 210, 118, "#91cfff", 2, .15);
        drawSpiralGalaxy(cx + 35, cy + 125, 100, 54, "#f2c7ff", 2, -.1);
        drawEllipticalGalaxy(cx - 285, cy - 150, 78, 40, "#9cbcff", .3);
        drawEllipticalGalaxy(cx + 300, cy + 140, 62, 34, "#ffd89a", -.4);
      } else if (location.kind === "laniakea") {
        drawLaniakea(cx, cy, location.body);
      } else if (location.kind === "generated") {
        drawGeneratedCosmos(cx, cy, location);
      } else if (
        location.kind === "planet" ||
        location.kind === "sun" ||
        location.kind === "nebula"
      ) {
        const x = 675;
        const y = 145;

        if (location.kind === "nebula") {
          const cloud = ctx.createRadialGradient(x, y, 8, x, y, radius * 1.5);
          cloud.addColorStop(0, location.body);
          cloud.addColorStop(.45, "rgba(100,150,255,.35)");
          cloud.addColorStop(1, "rgba(30,40,90,0)");
          ctx.fillStyle = cloud;
          ctx.beginPath();
          ctx.ellipse(x, y, radius * 1.5, radius, -.25, 0, Math.PI * 2);
          ctx.fill();
        } else {
          if (location.rings) {
            ctx.strokeStyle = "rgba(255,235,180,.85)";
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.ellipse(x, y, radius * 1.65, radius * .42, -.18, 0, Math.PI * 2);
            ctx.stroke();
          }

          const planet = ctx.createRadialGradient(
            x - radius * .35,
            y - radius * .35,
            Math.max(2, radius * .08),
            x,
            y,
            radius
          );

          planet.addColorStop(0, "#fff4d0");
          planet.addColorStop(.25, location.body);
          planet.addColorStop(1, "#111426");

          ctx.fillStyle = planet;
          ctx.shadowColor = location.body;
          ctx.shadowBlur = 22;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      ctx.save();
      ctx.fillStyle = "rgba(3,8,24,.68)";
      ctx.fillRect(canvas.width - 285, 8, 275, 50);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 18px Arial, 'Microsoft JhengHei', sans-serif";
      ctx.fillText(location.name, canvas.width - 18, 30);
      ctx.font = "13px Arial";
      ctx.fillText(`探索進度：${Math.floor(worldDistance)}`, canvas.width - 18, 49);
      ctx.restore();
    }

    function drawHUD() {
      ctx.fillStyle = "#fff";
      ctx.textAlign = "left";
      ctx.font = "18px Arial";
      ctx.fillText("分數：" + score, 18, 27);
      ctx.fillText("生命：" + "❤".repeat(Math.max(0, lives)), 18, 52);
      ctx.fillText("武器：Lv." + weaponLevel, 18, 77);

      ctx.fillStyle = "#ffe66d";
      ctx.fillText("護盾：" + (shieldStars ? "★".repeat(shieldStars) : "無"), 18, 102);
      ctx.fillText("代幣：" + coins, 18, 127);

      ctx.fillStyle = skillCooldown > 0 ? "#a9bddf" : "#62fff0";
      ctx.fillText(
        skillCooldown > 0
          ? `技能冷卻 ${Math.ceil(skillCooldown / 60)} 秒`
          : "技能就緒",
        18,
        152
      );
    }

    function drawEffects() {
      if (!player) return;

      if (upgradeTimer > 0) {
        const progress = 1 - upgradeTimer / 100;

        ctx.save();
        ctx.globalAlpha = 1 - progress;
        ctx.strokeStyle = "#7df9ff";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#7df9ff";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 30 + progress * 60, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "bold 28px Arial";
        ctx.fillStyle = "#7df9ff";
        ctx.shadowColor = "#36c8ff";
        ctx.shadowBlur = 16;
        ctx.fillText("武器升級！ Lv." + weaponLevel, canvas.width / 2, 145);
        ctx.restore();
      }

      if (shieldTimer > 0) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "bold 26px Arial";
        ctx.fillStyle = "#ffe66d";
        ctx.shadowColor = "#ffcf40";
        ctx.shadowBlur = 16;
        ctx.fillText("護盾增加 ★", canvas.width / 2, 178);
        ctx.restore();
      }

      if (boss) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "bold 24px Arial";
        ctx.fillStyle = "#ff82aa";
        ctx.shadowColor = "#ff3e86";
        ctx.shadowBlur = 12;
        ctx.fillText("大魔王出現！", canvas.width / 2, 35);
        ctx.restore();
      }
    }

    function updateGame() {
      frame++;

      const movingForward = isDown("arrowup") || isDown("w");
      const movingDown = isDown("arrowdown") || isDown("s");

      if (movingForward) {
        player.y = Math.max(105, player.y - player.speed);
        worldDistance += FORWARD_SPEED;
      }

      if (movingDown) player.y += player.speed;
      if (isDown("arrowleft") || isDown("a")) player.x -= player.speed;
      if (isDown("arrowright") || isDown("d")) player.x += player.speed;

      player.x = Math.max(48, Math.min(canvas.width - 48, player.x));
      player.y = Math.max(105, Math.min(canvas.height - 42, player.y));

      const weapon = getActiveWeapon();
      if (isDown(" ") && frame % weapon.interval === 0) fireWeapon();

      if (frame % 70 === 0) {
        enemies.push({
          x: Math.random() * (canvas.width - 100) + 50,
          y: -50,
          r: 25 + Math.random() * 7,
          speed: Math.min(1.1, .45 + getCurrentLocationIndex() * .035),
          hp: ENEMY_MAX_HP,
          maxHp: ENEMY_MAX_HP,
          hit: false
        });
      }

      for (const shot of shots) {
        shot.x += shot.vx;
        shot.y -= shot.speed;
      }

      for (const enemy of enemies) enemy.y += enemy.speed;

      if (boss) {
        boss.x += boss.direction * boss.speed;
        const edge = boss.width / 2 + 8;

        if (boss.x > canvas.width - edge) {
          boss.x = canvas.width - edge;
          boss.direction = -1;
        } else if (boss.x < edge) {
          boss.x = edge;
          boss.direction = 1;
        }

        if (boss.hitFlash > 0) boss.hitFlash--;
        if (boss.hitCooldown > 0) boss.hitCooldown--;
        if (boss.contactCooldown > 0) boss.contactCooldown--;
      }

      for (const shot of shots) {
        if (shot.hit) continue;

        for (const enemy of enemies) {
          if (!enemy.hit &&
              Math.abs(shot.x - enemy.x) <= enemy.r + 8 &&
              Math.abs(shot.y - enemy.y) <= enemy.r + 8) {
            shot.hit = true;
            enemy.hp -= shot.damage;

            if (enemy.hp <= 0) {
              enemy.hit = true;
              addScore(10);
            }
            break;
          }
        }
      }

      if (boss && boss.hitCooldown <= 0) {
        const left = boss.x - boss.width / 2;
        const right = boss.x + boss.width / 2;
        const top = boss.y - boss.height / 2;
        const bottom = boss.y + boss.height / 2;

        for (const shot of shots) {
          if (!shot.hit &&
              shot.x >= left && shot.x <= right &&
              shot.y >= top && shot.y <= bottom) {
            shot.hit = true;
            boss.hitCooldown = 10;
            damageBoss(1);
            break;
          }
        }
      }

      updateAndDrawSkillBeam();

      if (boss &&
          boss.contactCooldown <= 0 &&
          Math.abs(boss.x - player.x) < boss.width / 2 + player.size &&
          Math.abs(boss.y - player.y) < boss.height / 2 + player.size) {
        boss.contactCooldown = 45;
        hitFlashTimer = 18;

        if (shieldStars > 0) shieldStars--;
        else {
          lives--;
          if (lives <= 0) {
            lives = 0;
            endGame();
          }
        }
      }

      for (const enemy of enemies) {
        if (!enemy.hit &&
            Math.hypot(enemy.x - player.x, enemy.y - player.y) < enemy.r + player.size) {
          enemy.hit = true;
          hitFlashTimer = 18;

          if (shieldStars > 0) shieldStars--;
          else {
            lives--;
            if (lives <= 0) {
              lives = 0;
              endGame();
              break;
            }
          }
        }
      }

      enemies = enemies.filter(enemy => !enemy.hit && enemy.y < canvas.height + enemy.r * 2);
      shots = shots.filter(shot =>
        !shot.hit &&
        shot.y > -20 &&
        shot.x > -20 &&
        shot.x < canvas.width + 20
      );

      if (upgradeTimer > 0) upgradeTimer--;
      if (shieldTimer > 0) shieldTimer--;
      if (hitFlashTimer > 0) hitFlashTimer--;
      if (skillCooldown > 0) skillCooldown--;
    }

    function updateAndDrawSkillBeam() {
      if (skillTimer <= 0) return;

      skillTimer--;
      skillDamageTimer++;

      const beamX = player.x + 26;
      const beamWidth = 76;

      ctx.save();
      ctx.globalAlpha = .75 + Math.sin(frame * .5) * .18;
      ctx.shadowColor = "#45f5ff";
      ctx.shadowBlur = 30;
      ctx.fillStyle = "#43eaff";
      ctx.fillRect(beamX - beamWidth / 2, 0, beamWidth, player.y - 26);
      ctx.globalAlpha = .95;
      ctx.fillStyle = "#fff";
      ctx.fillRect(beamX - 12, 0, 24, player.y - 26);
      ctx.restore();

      if (skillDamageTimer % 20 !== 0) return;

      for (const enemy of enemies) {
        if (!enemy.hit &&
            Math.abs(enemy.x - beamX) < beamWidth / 2 + enemy.r * .5 &&
            enemy.y < player.y) {
          enemy.hp--;
          if (enemy.hp <= 0) {
            enemy.hit = true;
            addScore(10);
          }
        }
      }

      if (boss &&
          Math.abs(boss.x - beamX) < beamWidth / 2 + boss.width / 2) {
        damageBoss(1);
      }
    }

    document.getElementById("bossPhoto").addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (uploadedBossUrl) URL.revokeObjectURL(uploadedBossUrl);
      uploadedBossUrl = URL.createObjectURL(file);
      bossImage.src = uploadedBossUrl;
    });

    function draw() {
      drawBackground(gameState === "playing");

      if (gameState === "playing") {
        updateGame();

        for (const shot of shots) drawShot(shot);
        for (const enemy of enemies) drawEnemy(enemy);

        drawBoss();
        drawEffects();
        drawPlayer();
      }

      drawHUD();
      requestAnimationFrame(draw);
    }

    resetGame();
    gameState = "menu";
    updateCoinDisplays();
    draw();
  </script>
</body>
